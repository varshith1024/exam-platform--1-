name: Exam Platform CI

on:
  pull_request:
    branches:
      - development
      - main

  push:
    branches:
      - development
      - main

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
             exam-platform/backend/package-lock.json
             exam-platform/frontend/package-lock.json


      - name: Install Backend Dependencies
        working-directory: exam-platform/backend
        run: npm ci

      - name: Run Backend Lint
        working-directory: exam-platform/backend
        run: npm run lint

      - name: Install Frontend Dependencies
        working-directory: exam-platform/frontend
        run: npm ci

      - name: Run Frontend Lint
        working-directory: exam-platform/frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: exam-platform/frontend
        run: npm run build